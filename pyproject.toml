[project]
name = "widelands-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Daniel Kuettel", email = "dkuettel@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "line-profiler>=5.0.2",
    "numpy>=2.4.3",
    # "pandas>=2.3.3",
    # "pandas-stubs>=3.0.0.260204",
    # "polars[style]>=1.39.0",
    # "pyinstrument>=5.1.2",
    "qpsolvers[clarabel]>=4.11.0",
    "pandas-stubs>=3.0.0.260204",
    "rich>=15.0.0",
    "streamlit>=1.57.0",
    "tabulate>=0.10.0",
    # "torch>=2.11.0",
    "typer>=0.25.1",
    "clarabel>=0.11.1",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.4",
]

[project.scripts]
test = "widelands_planner.test:test"
app = "widelands_planner.app:run"
qp = "widelands_planner.qp:app"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[tool.pyright]
ignore = ["widelands"]
reportUnusedCallResult = false
reportAny = false                   # st.session_state
reportUnnecessaryComparison = false # for case _ as never
reportUnreachable = false           # for assert_never
